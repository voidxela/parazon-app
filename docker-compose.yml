services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Named volume for persistent SQLite databases
      - parazon-data:/data
    environment:
      PORT: "3000"
      ALLOWED_ORIGINS: "http://localhost:8081"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      USERS_DB_PATH: "/data/users.db"
      CACHE_DB_PATH: "/data/cache.db"
      VECTOR_DB_PATH: "/data/knowledge_vector.db"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  parazon-data:
    driver: local
